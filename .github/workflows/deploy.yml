name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.PREFIX }}-backend:latest
            ${{ env.PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_SITE_URL=${{ vars.SITE_URL }}
          tags: |
            ${{ env.PREFIX }}-web:latest
            ${{ env.PREFIX }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          KEY="-i $HOME/.ssh/deploy_key"
          REMOTE="$SSH_USER@$SSH_HOST"

          # актуальный compose-файл на сервер
          scp $KEY docker-compose.yml "$REMOTE:$DEPLOY_PATH/docker-compose.yml"

          # логин в GHCR (токен передаётся через stdin)
          printf '%s' "$GHCR_TOKEN" | ssh $KEY "$REMOTE" \
            "docker login ghcr.io -u '$ACTOR' --password-stdin"

          # обновление и проверка здоровья
          ssh $KEY "$REMOTE" \
            "cd '$DEPLOY_PATH' &&
             IMAGE_PREFIX='$PREFIX' \
             TAG='$GITHUB_SHA' \
             TELEGRAM_BOT_TOKEN='$TELEGRAM_BOT_TOKEN' \
             TELEGRAM_CHAT_ID='$TELEGRAM_CHAT_ID' \
             bash -s" <<'EOF'
          set -euo pipefail
          docker compose pull
          docker compose up -d --remove-orphans
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "healthy"
              docker image prune -f
              exit 0
            fi
            sleep 4
          done
          docker compose logs --tail=50
          exit 1
          EOF